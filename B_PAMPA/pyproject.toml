[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclic-peptide-ai"
version = "0.2.0"
description = "Measured site selection and permeability effects of cyclic-peptide backbone N-methylation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3",
  "rdkit>=2024.3",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
encoders = ["transformers>=4.40,<5", "safetensors>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

